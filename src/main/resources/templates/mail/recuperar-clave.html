<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Restablecé tu contraseña de BarberYA</title>
</head>
<body style="margin:0;padding:0;background-color:#0f0f0f;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0f0f0f;">
	<tr>
		<td align="center" style="padding:32px 16px;">
			<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
				style="max-width:480px;background-color:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;">
				<tr th:replace="~{fragmentos.html :: encabezado}"></tr>
				<tr>
					<td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:24px;color:#e8e8e8;">
						<p style="margin:0 0 16px;" th:text="${saludo}">¡Hola!</p>
						<p style="margin:0 0 24px;">Pediste restablecer tu contraseña. Tocá el botón para elegir una nueva:</p>
						<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px;">
							<tr>
								<td style="border-radius:6px;background-color:#c9a227;">
									<a th:href="${link}" href="#"
										style="display:inline-block;padding:12px 28px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#0f0f0f;text-decoration:none;">Elegir contraseña nueva</a>
								</td>
							</tr>
						</table>
						<p style="margin:0 0 8px;color:#b5b5b5;font-size:14px;">
							El link vence en <span th:text="${minutos}">30</span> minutos y sirve una sola vez.
							Si el botón no anda, copiá este link:
						</p>
						<p style="margin:0;font-size:13px;word-break:break-all;">
							<a th:href="${link}" th:text="${link}" href="#" style="color:#c9a227;">link</a>
						</p>
					</td>
				</tr>
				<tr th:replace="~{fragmentos.html :: pie}"></tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Sin valor por defecto: sin MAIL_HOST la app no arranca en producción.
spring.mail.host=${MAIL_HOST}

# Detrás de un proxy o balanceador, getRemoteAddr() da la IP del proxy y los límites de intentos por IP
# cortarían a todos juntos. Esto hace que Tomcat tome la IP real de X-Forwarded-For.
# Activarlo solo si el proxy pisa ese header (si no, el cliente lo puede falsificar); nunca leerlo a mano.
# server.forward-headers-strategy=native

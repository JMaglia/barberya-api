spring.application.name=barberya-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secreto HS256 del access token. Sin valor por defecto: sin JWT_SECRET la app no arranca.
barberya.jwt.secret=${JWT_SECRET}
barberya.jwt.access-minutos=15
# Origen del front: se usa para CORS y para armar los links de los mails.
barberya.front-url=${FRONT_URL:http://localhost:5173}
# Client ID de Google Identity Services: los ID tokens tienen que traerlo como aud. Sin valor por defecto.
barberya.google.client-id=${GOOGLE_CLIENT_ID}

# Mails por SMTP. En desarrollo, Mailpit (compose.yaml; buzón en http://localhost:8025).
# En producción, el SMTP del proveedor por variables de entorno (ver .env.example).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
# Sin timeouts, JavaMail espera para siempre a un SMTP colgado y traba el executor de mails.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
barberya.mail.remitente=${MAIL_FROM:BarberYA <no-responder@barberya.app>}

# Límites de intentos de los endpoints de auth (en memoria, por IP y por mail). Ventanas fijas.
# Login: el contador por mail cuenta los intentos desde el último login exitoso.
barberya.limites.login.por-mail.maximo=10
barberya.limites.login.por-mail.ventana=15m
barberya.limites.login.por-ip.maximo=30
barberya.limites.login.por-ip.ventana=15m
barberya.limites.codigo-solicitar.por-mail.maximo=3
barberya.limites.codigo-solicitar.por-mail.ventana=15m
barberya.limites.codigo-solicitar.por-ip.maximo=10
barberya.limites.codigo-solicitar.por-ip.ventana=1h
# Se suma al tope de 5 intentos por código.
barberya.limites.codigo-verificar.por-mail.maximo=10
barberya.limites.codigo-verificar.por-mail.ventana=15m
barberya.limites.codigo-verificar.por-ip.maximo=30
barberya.limites.codigo-verificar.por-ip.ventana=15m
barberya.limites.recuperar.por-mail.maximo=3
barberya.limites.recuperar.por-mail.ventana=1h
barberya.limites.recuperar.por-ip.maximo=10
barberya.limites.recuperar.por-ip.ventana=1h
barberya.limites.registro.por-ip.maximo=10
barberya.limites.registro.por-ip.ventana=1h
barberya.limites.google.por-ip.maximo=30
barberya.limites.google.por-ip.ventana=15m

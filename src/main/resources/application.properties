spring.application.name=barberya-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secreto HS256 del access token. Sin valor por defecto: sin JWT_SECRET la app no arranca.
barberya.jwt.secret=${JWT_SECRET}
barberya.jwt.access-minutos=15
# Origen del front: se usa para CORS y para armar los links de los mails.
barberya.front-url=${FRONT_URL:http://localhost:5173}

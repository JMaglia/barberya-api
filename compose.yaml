services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=barberya'
      - 'POSTGRES_USER=barberya'
      - 'POSTGRES_PASSWORD=barberya'
    ports:
      - '5433:5432'

  # Buzón falso para desarrollo: SMTP en 1025, interfaz web en http://localhost:8025
  mailpit:
    image: 'axllent/mailpit'
    ports:
      - '1025:1025'
      - '8025:8025'